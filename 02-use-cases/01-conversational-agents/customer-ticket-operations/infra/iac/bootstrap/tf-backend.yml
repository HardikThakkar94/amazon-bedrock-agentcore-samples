AWSTemplateFormatVersion: "2010-09-09"
Description: "Terraform S3 remote state backend with KMS encryption and S3-native locking"

Parameters:
  ProjectName:
    Type: String
    Description: "Project name (lowercase, hyphenated)"
  Environment:
    Type: String
    Default: "dev1"
    Description: "Environment name"

Resources:
  TerraformStateKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "KMS key for ${ProjectName}-${Environment} Terraform state encryption"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Id: tf-backend-key
        Statement:
          - Sid: EnableRootAccountAccess
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-tf-state-key"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  TerraformStateKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${ProjectName}-${Environment}-tf-state-key"
      TargetKeyId: !Ref TerraformStateKmsKey

  TerraformStateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-${Environment}-tf-state-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              KMSMasterKeyID: !Ref TerraformStateKmsKey
              SSEAlgorithm: "aws:kms"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-tf-state"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  TerraformStateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TerraformStateBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt TerraformStateBucket.Arn
              - !Sub "${TerraformStateBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"
          - Sid: DenyIncorrectEncryption
            Effect: Deny
            Principal: "*"
            Action: "s3:PutObject"
            Resource: !Sub "${TerraformStateBucket.Arn}/*"
            Condition:
              StringNotEquals:
                "s3:x-amz-server-side-encryption": "aws:kms"

Outputs:
  StateBucketName:
    Description: "S3 bucket for Terraform state"
    Value: !Ref TerraformStateBucket
  StateBucketArn:
    Description: "ARN of the Terraform state bucket"
    Value: !GetAtt TerraformStateBucket.Arn
  KmsKeyArn:
    Description: "ARN of the KMS key for state encryption"
    Value: !GetAtt TerraformStateKmsKey.Arn
  KmsKeyAlias:
    Description: "Alias of the KMS key"
    Value: !Ref TerraformStateKmsKeyAlias
