[project]
name = "sec310-sample"
version = "0.1.0"
description = "Code-talk sample: evolving a security evidence agent from unsafe prototype to a bounded, production-shaped control plane."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT-0" }
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
# Only needed for the optional live paths (`--live`, the `live` stage). The default demo is
# fully offline. 1.43 is the floor for InvokeGuardrailChecks and the AgentCore Policy APIs.
aws = ["boto3>=1.43"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sec310_sample"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # formatter owns line length; a few long string literals remain by design
