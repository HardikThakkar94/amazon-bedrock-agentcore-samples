[project]
name = "sec310-agent"
version = "0.1.0"
description = "re:Invent code talk: a support agent on Amazon Bedrock AgentCore, bounded build by build (V0-V5)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT-0" }
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
# Tests and local tooling; the agent's own pins are in src/sec310_agent/requirements.txt.
aws = ["boto3>=1.43"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sec310_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # formatter owns line length; a few long string literals remain by design
